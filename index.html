<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/formulario.css">
   <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Original+Surfer&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
</style>
</head>

<body> 

    <div class="banner">
        <img src="./img/banner.png" alt="">
    </div>
    <div class="container">
        <div class="bem">
    <h1>Bem Vindo a Casas Bahia</h1>
    </div>
    <form>

        <div class="form-control">
            <label for="nome">Nome:</label>
            <input type="text"  id="nome" placeholder="Digite seu nome completo"/>
        </div> 

        <div class="form-control">
            <label for="email">Email:</label>
            <input type="email" id="email"  placeholder="Digite seu email">
        </div>

        <div class="form-control">
            <label for="senha">Senha:</label>
            <input type="password"  id="senha" placeholder="Digite seu senha">
        </div>
        <div class="form-control">
            <label for="data">Data de Nascimento:</label>
            <input type="date" id="data"/>
        </div>
        <div class="form-control">
            <label for="curso">O que procura:</label>
            <select  id="curso">
                <option value="">Selecione</option>
                <option value="moveis">Móveis</option>
                <option value="eletrodomesticos">Eletrodomésticos</option>
                 <option value="eletroportateis">Eletroportáteis</option>
            </select>
        </div>
        <div class="form-control">
           
            <button type="submit" class="btn-cadastro">Cadastrar</button>
              <button type="reset" class="btn-limpar">Limpar</button> 
           
        </div> 

              <div class="entrar">
                <h1>Já tem uma conta?</h1>
                  <a href="login.html">Entrar</a>
                </div>
    </form>
        </div>
        
 
</body>

</html>
