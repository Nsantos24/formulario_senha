<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/login.css">
      <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Original+Surfer&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
</style>
</head>

<body>
    <div class="banner">
        <img src="./img/banner.png" alt="">
    </div>
    <div class="container">
        <div class="logo">
            <img src="./img/logo.png" alt="">
        </div>
        <div class="login">
        <h1>Que bom ter você de volta</h1>
        <h2>Entre na sua conta</h2>
    </div>
        <form>
            <div class="form-control">
                <label for="login">Login:</label>
                <input type="text" id="login" placeholder="Digite seu login"/>
            </div>

             <div class="form-control">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Digite seu email"/>
            </div>

             <div class="form-control">
               
                <label for="senha">Senha:</label>
                <input type="password" id="senha" placeholder="Digite seu senha"/> 
                <div class="esqueci">
                <a href="senha.html">Esqueci minha senha</a>
            </div>
            </div>

            <div class="form-control">
                <div class="opcoes">
                <input type="checkbox" id="lembrar">
                <label for="lembrar">lembrar meu login</label>
                </div>
            </div>

            <div class="form-control">
                <label> Tipo de acesso:</label>
                <div class="opcoes">
                    <input type="radio" id="cliente" name="tipo" value="cliente"/>
                    <label for="cliente">Cliente</label>
                     
                    <input type="radio" id="funcionario" name="tipo" value="funcionario"/>
                    <label for="funcionario">Funcionário</label>

                </div>
            </div>

            <div class="form-control">
                <label for="cidade">Cidade:</label>

                <select id="cidade">
                    <option value="">Selecione sua cidade</option>
                    <option value="osasco">Osasco</option>
                    <option value="carapicuiba">Carapicuíba</option>
                    <option value="cotia">Cotia</option>
                    <option value="sao_paulo">São Paulo</option>
                </select>
                <div class="form-control">
                    <button type="submit">Entrar</button>
                </div>
                <hr>
                 <div class="cadastrar">
                <h1>Ainda não tem conta?</h1>
                  <a href="index.html">Cadastre-se</a>
                </div>
            </div>
        </form>
    </div>

</body>
</html>
